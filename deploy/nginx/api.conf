# =====================================================================
# Nginx Reverse Proxy com SSL (Let's Encrypt) para Oracle VPS
# Coloque em: /etc/nginx/sites-available/api.seudominio.com
# =====================================================================

server {
    listen 80;
    server_name api.seudominio.com; # Substitua pelo seu subdomínio

    # Redireciona HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.seudominio.com;

    # Certificados SSL gerados pelo Certbot (certbot --nginx -d api.seudominio.com)
    ssl_certificate /etc/letsencrypt/live/api.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seudominio.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy para o container Spring Boot na porta 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a Webhooks e requisições longas
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
