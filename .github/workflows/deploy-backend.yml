name: Deploy Backend & PostgreSQL (Oracle VPS)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # =====================================================================
  # 1. Compila e Publica a Imagem Docker no GitHub Packages (GHCR)
  # =====================================================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar QEMU para Multi-arquitetura (ARM64 / AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados e Tags Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e Push da Imagem do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================================
  # 2. Conecta via SSH na Oracle VPS e Atualiza os Containers
  # =====================================================================
  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}           # IP público da Oracle VPS
          username: ${{ secrets.VPS_USER }}       # Ex: ubuntu ou opc
          key: ${{ secrets.VPS_SSH_KEY }}         # Chave privada SSH (.key)
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Navega até a pasta da aplicação na VPS
            mkdir -p /opt/flow-chamados
            cd /opt/flow-chamados

            # 2. Faz login no registro do GitHub para autorizar o pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 3. Baixa a nova imagem gerada pelo build
            docker compose pull backend

            # 4. Sobe os containers atualizados sem derrubar o banco
            docker compose up -d --remove-orphans

            # 5. Limpa imagens antigas não utilizadas para liberar espaço em disco
            docker image prune -f
