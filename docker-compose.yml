services:
  # =====================================================================
  # 1. Banco de Dados PostgreSQL 16
  # =====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: flow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flow_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Expõe na porta local apenas se precisar de acesso externo (ex: DBeaver/pgAdmin)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-flow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flow_network

  # =====================================================================
  # 2. Backend Spring Boot 3
  # =====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-flow-backend:latest}
    container_name: flow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Banco de dados (aponta para o container 'postgres' na mesma rede docker)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flow_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      
      # Trello API & Webhook
      TRELLO_ENABLED: ${TRELLO_ENABLED:-true}
      TRELLO_API_KEY: ${TRELLO_API_KEY}
      TRELLO_TOKEN: ${TRELLO_TOKEN}
      TRELLO_BOARD_ID: ${TRELLO_BOARD_ID}
      TRELLO_WEBHOOK_URL: ${TRELLO_WEBHOOK_URL}
      TRELLO_LIST_CRIADO: ${TRELLO_LIST_CRIADO}
      TRELLO_LIST_EM_ANDAMENTO: ${TRELLO_LIST_EM_ANDAMENTO}
      TRELLO_LIST_AGUARDANDO_ACAO: ${TRELLO_LIST_AGUARDANDO_ACAO}
      TRELLO_LIST_FINALIZADO: ${TRELLO_LIST_FINALIZADO}
      
      # Autenticação e CORS
      ADMIN_API_KEY: ${ADMIN_API_KEY:-flow-admin-secret-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://*.vercel.app}
    ports:
      - "8080:8080"
    networks:
      - flow_network

networks:
  flow_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
