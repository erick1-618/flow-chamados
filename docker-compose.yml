services:
  # =====================================================================
  # 1. Banco de Dados PostgreSQL 16
  # =====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: flow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flow_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-flow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flow_network

  # =====================================================================
  # 2. Backend Spring Boot 3 (Imagem gerada pelo GitHub Actions)
  # =====================================================================
  backend:
    image: ghcr.io/erick1-618/flow-chamados/backend:latest
    container_name: flow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flow_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      
      TRELLO_ENABLED: ${TRELLO_ENABLED:-true}
      TRELLO_API_KEY: ${TRELLO_API_KEY}
      TRELLO_TOKEN: ${TRELLO_TOKEN}
      TRELLO_BOARD_ID: ${TRELLO_BOARD_ID}
      TRELLO_WEBHOOK_URL: ${TRELLO_WEBHOOK_URL}
      TRELLO_LIST_CRIADO: ${TRELLO_LIST_CRIADO}
      TRELLO_LIST_EM_ANDAMENTO: ${TRELLO_LIST_EM_ANDAMENTO}
      TRELLO_LIST_AGUARDANDO_ACAO: ${TRELLO_LIST_AGUARDANDO_ACAO}
      TRELLO_LIST_FINALIZADO: ${TRELLO_LIST_FINALIZADO}
      TRELLO_LIST_EXCLUIDO: ${TRELLO_LIST_EXCLUIDO:-6ab952308e7442f8e2e36533}
      
      ADMIN_API_KEY: ${ADMIN_API_KEY:-flow-admin-secret-2026}
      FRONTEND_URL: ${FRONTEND_URL:-https://flow.erickborba.dev.br}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://*.vercel.app,https://flow.erickborba.dev.br}

    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - flow_network

networks:
  flow_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
